# Публикация приложения на GitHub Pages: https://<владелец>.github.io/<репозиторий>/
# Один раз включите Pages: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта
    # публикуется только ветка по умолчанию
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - name: Сборка для подкаталога Pages
        run: npm run build:static
        env:
          BASE: ${{ steps.pages.outputs.base_path }}/
          # необязательно: адрес своего сервера HinoVerse (ИИ и синхронизация) — переменная репозитория
          VITE_SERVER_URL: ${{ vars.HINOVERSE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
