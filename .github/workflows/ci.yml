# Проверка при каждом пуше и пулл-реквесте: типы, тесты, сборка.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
